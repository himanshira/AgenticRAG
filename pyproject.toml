[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG with CrewAI: router agent + retriever agent over PDF and web sources"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=1.15,<2",
    "tavily-python>=0.7",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agentic-rag = "agentic_rag.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
